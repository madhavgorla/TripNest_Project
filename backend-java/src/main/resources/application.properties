# TripNest Java Backend Configuration
server.port=8080

# Application Name
spring.application.name=tripnest-java-backend

# PostgreSQL Database Configuration (Replace with Neon DATABASE_URL or local Postgres)
# spring.datasource.url=jdbc:postgresql://localhost:5432/tripnest_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback Default: H2 In-Memory DB for instant zero-config startup
spring.datasource.url=jdbc:h2:mem:tripnest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate DDL Auto & Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Settings
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
